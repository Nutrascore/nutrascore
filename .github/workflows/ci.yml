name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nutrascore
          POSTGRES_USER: nutrascore
          POSTGRES_PASSWORD: nutrascore_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrascore -d nutrascore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Lightning CSS native binary
        run: pnpm --filter web add lightningcss-linux-x64-gnu@1.33.0

      - name: Database migration
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://nutrascore:nutrascore_dev@localhost:5432/nutrascore

      - name: Check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build