name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and start PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-17
          sudo systemctl start postgresql
          sudo -u postgres psql --command "CREATE ROLE nutrascore WITH LOGIN PASSWORD 'nutrascore_dev';"
          sudo -u postgres createdb --owner=nutrascore nutrascore

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Lightning CSS native binary
        run: pnpm --filter web add lightningcss-linux-x64-gnu@1.33.0

      - name: Database migration
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://nutrascore:nutrascore_dev@localhost:5432/nutrascore

      - name: Check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://nutrascore:nutrascore_dev@localhost:5432/nutrascore

      - name: Build
        run: pnpm build
